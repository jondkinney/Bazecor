name: Staging

on:
  push:
    branches:
      - "*"
      - "development"
  pull_request:
    branches:
      - "*"
      - "development"

permissions:
  contents: read

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-2022
          - os: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install -g yarn
      - if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install libudev-dev
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'yarn.lock') }}
      - name: Install node_modules
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --network-timeout 300000 # sometimes yarn takes time, therefore, we increase the timeout
      - run: yarn run test

  build:
    name: Bazecor ${{ matrix.target_os }}_${{ matrix.target_arch }} binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
        target_arch: [arm, amd64]
        include:
          - os: ubuntu-22.04
            target_os: linux
          - os: windows-2022
            target_os: windows
          - os: macos-latest
            target_os: darwin
        exclude:
          - os: windows-2022
            target_arch: arm
          - os: ubuntu-22.04
            target_arch: arm
    runs-on: ${{ matrix.os }}
    needs: [testing]
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install -g yarn
      - if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install libudev-dev
      - if: runner.os == 'Windows'
        name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - if: runner.os == 'Windows'
        name: Get JSign
        shell: bash
        run: |
          JAR_URL="https://github.com/ebourg/jsign/releases/download/5.0/jsign-5.0.jar"
          curl -L -o jsign.jar $JAR_URL
          mkdir windows_signing
          cp jsign.jar windows_signing/jsign.jar
      - if: runner.os == 'Windows'
        name: Setup GCloud Auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SIGNER_SERVICE_ACCOUNT }}"
      - if: runner.os == 'Windows'
        name: "Set up GCloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"
        env:
          CLOUDSDK_PYTHON: ${{ env.pythonLocation }}${{ '\python' }}
        with:
          version: ">= 416.0.0"
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'yarn.lock') }}
      - name: Install node_modules
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --network-timeout 300000 # sometimes yarn takes time, therefore, we increase the timeout
      # Lens is an Electron app: the binary can't be moved on its own, it needs its whole
      # packaged directory (locales/, *.pak, native DLLs, etc) alongside it, and on macOS it's
      # a .app bundle rather than a bare executable. So each platform downloads and unpacks
      # the portable zip/AppImage published by Dygma-Lens's own release workflow, using each
      # OS's native shell (Git Bash's tar can't extract .zip on Windows runners).
      - if: runner.os == 'Windows'
        name: Download Lens executable (Windows)
        shell: pwsh
        env:
          # Dygma-Lens is a public repo, so the ephemeral, always-available Actions token
          # is enough to read its releases — no custom PAT/secret needed for this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $LensVersion = (Get-Content package.json | ConvertFrom-Json).lensVersion
          New-Item -ItemType Directory -Force -Path src/lens-bin | Out-Null
          gh release download "v$LensVersion" -R Dygmalab/Dygma-Lens --pattern "*win32-x64*.zip" --dir . --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to download Lens v$LensVersion from Dygmalab/Dygma-Lens (gh exit $LASTEXITCODE)."
            exit 1
          }
          $zip = Get-ChildItem -Filter "*win32-x64*.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Error "Downloaded Lens release v$LensVersion but found no win32-x64 zip asset."
            exit 1
          }
          Expand-Archive -Path $zip.FullName -DestinationPath src/lens-bin -Force
          Remove-Item $zip.FullName
      - if: runner.os == 'macOS'
        name: Download Lens executable (macOS)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LENS_VERSION=$(node -p "require('./package.json').lensVersion")
          mkdir -p src/lens-bin
          TMP_DIR=$(mktemp -d)
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then PATTERN="*darwin-arm64*.zip"; else PATTERN="*darwin-x64*.zip"; fi
          gh release download "v${LENS_VERSION}" -R Dygmalab/Dygma-Lens --pattern "$PATTERN" --dir "$TMP_DIR" --clobber
          mkdir -p "$TMP_DIR/extracted"
          unzip -q "$TMP_DIR"/*.zip -d "$TMP_DIR/extracted"
          APP_BUNDLE=$(find "$TMP_DIR/extracted" -maxdepth 2 -name "*.app" | head -n1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No .app bundle found inside the downloaded Lens zip"
            exit 1
          fi
          cp -R "$APP_BUNDLE" "src/lens-bin/Dygma Lens.app"
          chmod +x "src/lens-bin/Dygma Lens.app/Contents/MacOS/dygma-lens"
          rm -rf "$TMP_DIR"
      - if: runner.os == 'Linux'
        name: Download Lens executable (Linux)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LENS_VERSION=$(node -p "require('./package.json').lensVersion")
          mkdir -p src/lens-bin
          gh release download "v${LENS_VERSION}" -R Dygmalab/Dygma-Lens --pattern "*.AppImage" --dir src/lens-bin --clobber
          mv src/lens-bin/*.AppImage src/lens-bin/dygma-lens
          chmod +x src/lens-bin/dygma-lens
      - if: runner.os == 'macOS'
        name: Setup Apple certificates
        env:
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
          APPLE_APPLICATION_CERT_BASE64: ${{ secrets.APPLE_APPLICATION_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          APPLE_INSTALLER_CERT_PATH=$RUNNER_TEMP/apple_installer.p12
          APPLE_APPLICATION_CERT_PATH=$RUNNER_TEMP/apple_application.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/apple-signing.keychain-db
          # create certificates from base64
          echo -n "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode -o $APPLE_INSTALLER_CERT_PATH
          echo -n "$APPLE_APPLICATION_CERT_BASE64" | base64 --decode -o $APPLE_APPLICATION_CERT_PATH
          # create keychain stuff
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          #import certificates
          echo "Importing installer cert"
          security import $APPLE_INSTALLER_CERT_PATH -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          echo "Importing application cert"
          security import $APPLE_APPLICATION_CERT_PATH -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          # - run: yarn run lint
      - if: runner.os == 'macOS' && matrix.target_arch == 'amd64'
        name: Build for MacOS Intel
        env:
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn run make-mac-intel
      - if: runner.os == 'macOS'  && matrix.target_arch == 'arm'
        name: Build for MacOS Arm
        env:
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLEIDPASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn run make-mac-arm
      - if: runner.os != 'macOS'
        name: Build for Linux/Windows
        run: yarn run make
      - if: runner.os == 'Windows'
        shell: bash
        name: Get executable into signing folder
        # we replace empty spaces in the filename with -
        run: |
          find out/make -type f -name '*.exe' -exec bash -c 'mv "$1" "${1// /-}"' _ {} \;
          find out/make -type f -name '*.exe' -exec cp -v {} windows_signing \;
      - if: runner.os == 'Windows'
        name: Sign executable
        shell: bash
        run: |
          cd windows_signing
          echo "${{ secrets.DIGICERT_CERT_BASE64}}" | base64 --decode > dygma_cert.pem
          ls -R .
          EXE_FILE=$(find .  -type f -name '*.exe' -exec basename {} \; 2>/dev/null | head -n 1)
          echo "Found .exe file:"
          echo $EXE_FILE
          java -jar jsign.jar --storetype GOOGLECLOUD --storepass "$(gcloud auth print-access-token)" \
            --keystore "${{ secrets.GCP_KEYSTORE }}" --alias "${{ secrets.GCP_WINDOWS_SIGNING_KEY }}" \
            --certfile "dygma_cert.pem" --tsmode RFC3161 --tsaurl http://timestamp.digicert.com $EXE_FILE
          cd ..
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Bazecor-${{ matrix.os }}-${{ matrix.target_arch }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.AppImage
            out/make/**/*.zip
            out/make/**/*.nupkg
            out/make/**/RELEASES*
            windows_signing/**/*.exe

      - name: Show build items
        run: |
          ls -R out/make
